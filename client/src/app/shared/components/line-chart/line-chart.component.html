<div class="line"><svg viewBox="0 0 580 220" preserveAspectRatio="none"><g class="grid"><line *ngFor="let y of [40,90,140,190]" x1="25" [attr.y1]="y" x2="560" [attr.y2]="y"></line></g><polyline [attr.points]="points"></polyline><circle *ngFor="let d of data;let i=index" [attr.cx]="30+(i*(520/(data.length>1?data.length-1:1)))" [attr.cy]="190-(d.value/max*150)" r="4"></circle></svg><div class="labels"><span *ngFor="let d of data">{{d.name}}</span></div></div>
