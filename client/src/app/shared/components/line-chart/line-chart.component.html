<div class="line">

  <svg
    viewBox="0 0 580 220"
    preserveAspectRatio="none"
  >

    <g class="grid">

      <line
        *ngFor="
          let y of [
            40,
            90,
            140,
            190
          ]
        "
        x1="25"
        [attr.y1]="y"
        x2="560"
        [attr.y2]="y"
      ></line>

    </g>


    <!-- LINHA VERTICAL AO PASSAR O MOUSE -->

    <line
      *ngIf="
        hoverIndex !== null
      "
      class="hover-guide"
      [attr.x1]="hoverX"
      y1="40"
      [attr.x2]="hoverX"
      y2="190"
    ></line>


    <polyline
      [attr.points]="points"
    ></polyline>


    <g
      *ngFor="
        let d of data;
        let i = index
      "
    >

      <!-- ÁREA DE HOVER -->

      <circle
        class="point-hit"
        [attr.cx]="pointX(i)"
        [attr.cy]="pointY(d.value)"
        r="13"
        (mouseenter)="
          showTooltip(
            $event,
            d,
            i
          )
        "
        (mousemove)="
          moveTooltip($event)
        "
        (mouseleave)="
          hideTooltip()
        "
      ></circle>


      <!-- PONTO VISÍVEL -->

      <circle
        class="point"
        [attr.cx]="pointX(i)"
        [attr.cy]="pointY(d.value)"
        r="4"
      ></circle>

    </g>

  </svg>


  <div class="labels">

    <span
      *ngFor="let d of data"
    >
      {{ d.name }}
    </span>

  </div>


  <div
    *ngIf="tooltipVisible"
    class="chart-tooltip"
    [style.left.px]="tooltipX"
    [style.top.px]="tooltipY"
  >

    <strong>
      {{ tooltipName }}
    </strong>

    <span>
      value : {{ tooltipValue }}
    </span>

  </div>

</div>
