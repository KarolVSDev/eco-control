<aside><div class="brand">ECO <span>CONTROL</span></div><nav><a *ngFor="let l of links" [routerLink]="l.to" routerLinkActive="active" [routerLinkActiveOptions]="{exact:l.to==='/'}" [hidden]="l.adminOnly && !auth.isAdmin"><b>{{l.icon}}</b>{{l.label}}</a></nav><div class="foot"><div><strong>{{auth.user?.full_name||auth.user?.email}}</strong><small>{{auth.isAdmin?'ADMIN':'ANALISTA'}}</small></div><button (click)="logout()">↪</button></div></aside>
