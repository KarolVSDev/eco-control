<div class="page"><h1 class="title">Relatórios</h1><p class="subtitle">Auditoria completa das alterações realizadas nas ECOs.</p><div class="toolbar"><input class="input" type="date" [(ngModel)]="dateStart"><input class="input" type="date" [(ngModel)]="dateEnd"><input class="input" placeholder="Usuário/e-mail" [(ngModel)]="user"><input class="input" placeholder="Tipo de alteração" [(ngModel)]="field"><input class="input" placeholder="Buscar ECO" [(ngModel)]="eco"><button class="btn btn-primary" (click)="page=1;load()">Filtrar</button><button class="btn btn-ghost" (click)="clear()">Limpar</button></div><div class="table-wrap"><table class="table"><thead><tr><th>Data/Hora</th><th>Usuário</th><th>ECO</th><th>Campo</th><th>Anterior</th><th>Novo</th></tr></thead><tbody><tr *ngFor="let r of rows"><td class="mono">{{r.created_at|date:'dd/MM/yyyy, HH:mm:ss'}}</td><td>{{r.user_name||r.user_email}}</td><td class="mono danger">{{r.eco_code||('#'+r.item)}}</td><td><b>{{r.field_label}}</b></td><td class="muted">{{r.old_value||'—'}}</td><td class="danger">{{r.new_value||'—'}}</td></tr></tbody></table></div><div class="toolbar" style="justify-content:center"><button class="btn btn-ghost" [disabled]="page<=1" (click)="page=page-1;load()">Anterior</button><span>Página {{page}} de {{pages()}}</span><select class="select" [(ngModel)]="pageSize" (change)="page=1;load()"><option [value]="20">20</option><option [value]="50">50</option><option [value]="100">100</option></select><button class="btn btn-ghost" [disabled]="page>=pages()" (click)="page=page+1;load()">Próxima</button></div></div>
