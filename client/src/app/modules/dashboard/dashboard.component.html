<div class="page"><h1 class="title">Dashboard</h1><p class="subtitle">Visão geral do controle de ECOs.</p><div class="stats" *ngIf="stats"><app-stat-card label="Total ECO" [value]="stats.total"></app-stat-card><app-stat-card label="Working" [value]="stats.working" tone="info"></app-stat-card><app-stat-card label="On Hold" [value]="stats.on_hold" tone="warning"></app-stat-card><app-stat-card label="Processing" [value]="stats.processing" tone="info"></app-stat-card><app-stat-card label="Released" [value]="stats.released" tone="success"></app-stat-card><app-stat-card label="Rejected" [value]="stats.rejected" tone="danger"></app-stat-card><app-stat-card label="Cancelled" [value]="stats.cancelled"></app-stat-card><app-stat-card label="Overdue" [value]="stats.overdue" tone="danger"></app-stat-card><app-stat-card label="Gap > 7 dias" [value]="stats.gap7" tone="warning"></app-stat-card><app-stat-card label="Gap > 14 dias" [value]="stats.gap14" tone="danger"></app-stat-card></div>
<div class="grid grid-2 charts"><app-chart-card title="ECO por Status" subtitle="Distribuição por status atual" [months]="months" (monthChange)="reload('status',$event)"><app-donut-chart [data]="status"></app-donut-chart></app-chart-card><app-chart-card title="Evolução de ECOs por Mês" subtitle="Quantidade de ECOs registrados por mês" [filter]="false"><app-line-chart [data]="evolution"></app-line-chart></app-chart-card><app-chart-card title="ECO por Grupo" subtitle="Distribuição por grupo de trabalho" [months]="months" (monthChange)="reload('group',$event)"><app-donut-chart [data]="groups"></app-donut-chart></app-chart-card><app-chart-card title="ECO por Owner" subtitle="ECOs por responsável" [months]="months" (monthChange)="reload('owner',$event)"><app-horizontal-bar-chart [data]="owner"></app-horizontal-bar-chart></app-chart-card><app-chart-card title="ECO por OBU" subtitle="ECOs por unidade de negócio" [months]="months" (monthChange)="reload('obu',$event)"><app-horizontal-bar-chart [data]="obu"></app-horizontal-bar-chart></app-chart-card><app-chart-card title="ECO por AU" subtitle="ECOs por área de suporte" [months]="months" (monthChange)="reload('au',$event)"><app-horizontal-bar-chart [data]="au"></app-horizontal-bar-chart></app-chart-card><app-chart-card title="ECO por Tipo" subtitle="Distribuição por tipo de ECO" [months]="months" (monthChange)="reload('eco_type',$event)"><app-horizontal-bar-chart [data]="types"></app-horizontal-bar-chart></app-chart-card><app-chart-card title="ECO por Tempo de Atraso" subtitle="Distribuição por tempo de processamento (AZ Gap)" [months]="months" (monthChange)="reload('delay',$event)"><app-delay-bar-chart [data]="delay"></app-delay-bar-chart></app-chart-card></div>
<section class="card summary"><h3>Resumo por Mês</h3><p class="subtitle">Distribuição mensal de ECOs por status</p><div class="table-wrap"><table class="table"><thead><tr><th>Mês</th><th>Total</th><th>Working</th><th>Processing</th><th>Cancelled</th><th>Released</th><th>Rejected</th></tr></thead><tbody><tr *ngFor="let r of summary"><td><b>{{r.month}}</b></td><td>{{r.total}}</td><td class="info">{{r.working}}</td><td>{{r.processing}}</td><td>{{r.cancelled}}</td><td class="success">{{r.released}}</td><td class="danger">{{r.rejected}}</td></tr></tbody></table></div></section></div>
