<div class="page"><h1 class="title">Configurações</h1><p class="subtitle">Parametrizações utilizadas pelas regras do ECO CONTROL.</p><div class="grid grid-2" style="margin-top:20px"><section class="card"><h3>OBU → AU</h3><div *ngFor="let x of data.obu_au" style="padding:7px;border-bottom:1px solid #303030"><b>{{x.obu}}</b> → {{x.au}}</div></section><section class="card"><h3>Owner → Group</h3><div *ngFor="let x of data.owner_group" style="padding:7px;border-bottom:1px solid #303030"><b>{{x.owner}}</b> → {{x.group}}</div></section><section class="card"><h3>Managers</h3><div *ngFor="let x of data.managers">{{x.name}}</div><div *ngIf="!data.managers.length" class="muted">Nenhum manager cadastrado.</div></section></div></div>
